<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a192f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TAXI GAB+">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/app_icon_512.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <title>Connexion — TAXI GAB+ BDC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260908v3">
</head>
<body class="login-page">

<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card card shadow-lg border-0" style="width:420px;">
    <!-- En-tête -->
    <div class="card-header login-header text-center py-4">
      <img src="{{ url_for('static', filename='images/logo_taxigab.png') }}"
           alt="TAXI GAB+" class="login-logo mb-2"
           onerror="this.style.display='none'; document.getElementById('login-brand').style.display='block'">
      <div id="login-brand" style="display:none;" class="mb-2">
        <span class="fs-3 fw-bold text-gold">TAXI GAB+</span>
      </div>
      <h5 class="mb-0 text-white fw-semibold">Gestion des bons de commande</h5>
    </div>

    <div class="card-body p-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-sm mb-3">
              <i class="bi bi-exclamation-circle me-1"></i>{{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">
            <i class="bi bi-person me-1"></i> Identifiant
          </label>
          <input type="text" name="username" class="form-control form-control-lg"
                 placeholder="Votre identifiant" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">
            <i class="bi bi-lock me-1"></i> Mot de passe
          </label>
          <div class="input-group">
            <input type="password" name="password" id="password-field"
                   class="form-control form-control-lg" placeholder="Votre mot de passe" required>
            <button type="button" class="btn btn-outline-secondary" id="toggle-pw"
                    onclick="togglePassword()">
              <i class="bi bi-eye" id="pw-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary-navy btn-lg w-100 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i> Se connecter
        </button>
      </form>
    </div>

    <div class="card-footer text-center text-muted small py-3">
      <i class="bi bi-shield-lock me-1"></i>
      Accès réservé au personnel autorisé — TAXI GAB+
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePassword() {
  const field = document.getElementById('password-field');
  const eye = document.getElementById('pw-eye');
  if (field.type === 'password') {
    field.type = 'text';
    eye.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    field.type = 'password';
    eye.classList.replace('bi-eye-slash', 'bi-eye');
  }
}
</script>
</body>
</html>
